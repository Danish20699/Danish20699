<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 225" width="100%" height="225">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGradient);
      letter-spacing: 2px;
    }
    .greeting {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 4px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Card -->
  <rect width="920" height="225" rx="14" fill="url(#bgGradient)" />
  <rect width="920" height="225" rx="14" fill="url(#grid)" />
  <rect width="920" height="225" rx="14" fill="none" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Accent Geometric Lights -->
  <circle cx="840" cy="50" r="95" fill="#38bdf8" fill-opacity="0.06" filter="url(#glow)" />
  <circle cx="80" cy="180" r="70" fill="#818cf8" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Content Elements -->
  <g transform="translate(55, 42)">
    <!-- Pre-title Greeting -->
    <text x="0" y="20" class="greeting">👋 HELLO WORLD, I'M</text>

    <!-- Main Name Title -->
    <text x="0" y="66" class="title">DANISH NAZIR</text>

    <!-- Subtitle Role -->
    <text x="0" y="103" class="subtitle">DevOps Engineer  •  Full-Stack Developer  •  MLOps</text>

    <!-- Highlights / Tech Pills -->
    <g transform="translate(0, 126)">
      <!-- Pill 1: DevOps & Docker -->
      <rect x="0" y="0" width="95" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="47" y="17" text-anchor="middle" class="tag">🐳 Docker</text>

      <!-- Pill 2: Ansible -->
      <rect x="103" y="0" width="98" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="152" y="17" text-anchor="middle" class="tag">⚙️ Ansible</text>

      <!-- Pill 3: React / MERN -->
      <rect x="209" y="0" width="90" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="254" y="17" text-anchor="middle" class="tag">⚛️ React</text>

      <!-- Pill 4: Node.js -->
      <rect x="307" y="0" width="95" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="354" y="17" text-anchor="middle" class="tag">🟢 Node.js</text>

      <!-- Pill 5: PostgreSQL -->
      <rect x="410" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="472" y="17" text-anchor="middle" class="tag">🐘 PostgreSQL</text>

      <!-- Pill 6: Python -->
      <rect x="543" y="0" width="95" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="590" y="17" text-anchor="middle" class="tag">🐍 Python</text>

      <!-- Pill 7: Linux -->
      <rect x="646" y="0" width="85" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="688" y="17" text-anchor="middle" class="tag">🐧 Linux</text>

      <!-- Pill 8: AWS -->
      <rect x="739" y="0" width="80" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="779" y="17" text-anchor="middle" class="tag">☁️ AWS</text>
    </g>
  </g>
</svg>
